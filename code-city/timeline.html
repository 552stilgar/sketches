<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code City — Timeline</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b1020;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      #app canvas {
        display: block;
      }

      .cc-mock-badge {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 10;
        padding: 6px 12px;
        background: #b3401a;
        color: #fff5e8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }

      .cc-fatal-error {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: #1a0a0a;
        color: #ffb4b4;
        font-family: ui-monospace, monospace;
        font-size: 14px;
        white-space: pre-wrap;
        text-align: center;
      }

      .cc-lens-control {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }

      .cc-lens-buttons {
        display: flex;
        gap: 4px;
        background: rgba(12, 16, 32, 0.78);
        border: 1px solid rgba(140, 170, 255, 0.3);
        border-radius: 6px;
        padding: 4px;
      }

      .cc-lens-button {
        background: transparent;
        border: none;
        border-radius: 4px;
        color: #9fb0e0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
      }

      .cc-lens-button:hover {
        color: #e8ecff;
      }

      .cc-lens-button--active {
        background: rgba(140, 170, 255, 0.28);
        color: #ffffff;
        font-weight: 600;
      }

      .cc-lens-legend {
        max-width: 320px;
        padding: 5px 10px;
        background: rgba(12, 16, 32, 0.78);
        border: 1px solid rgba(140, 170, 255, 0.3);
        border-radius: 4px;
        color: #9fb0e0;
        font-family: ui-monospace, "SFMono-Regular", monospace;
        font-size: 11px;
        letter-spacing: 0.02em;
        text-align: right;
        pointer-events: none;
      }

      /* Timeline scrub control (src/renderer/ui.ts setupTimelineControl) -- fixed bottom bar,
         always visible so the DATE is never ambiguous (acceptance criterion 3). */
      .cc-timeline-control {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        width: min(560px, 86vw);
        padding: 10px 18px 12px;
        background: rgba(12, 16, 32, 0.82);
        border: 1px solid rgba(140, 170, 255, 0.3);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }

      .cc-timeline-date {
        color: #e8ecff;
        font-family: ui-monospace, "SFMono-Regular", monospace;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.03em;
      }

      .cc-timeline-gap {
        color: #ffb066;
        font-family: ui-monospace, "SFMono-Regular", monospace;
        font-size: 11px;
        letter-spacing: 0.03em;
      }

      /* Defect 2 (Lane E), never-fabricate: same disclosure discipline as .cc-lens-legend's
         UNMEASURED wording -- distinct color from .cc-timeline-gap so a genuine history gap and a
         resolved-but-empty snapshot are never visually conflated as the same condition. */
      .cc-timeline-empty {
        color: #b98cff;
        font-family: ui-monospace, "SFMono-Regular", monospace;
        font-size: 11px;
        letter-spacing: 0.03em;
      }

      .cc-timeline-slider {
        width: 100%;
        accent-color: #8caaff;
      }

      .cc-timeline-months {
        display: flex;
        justify-content: space-between;
        width: 100%;
        color: #6b7aa8;
        font-family: ui-monospace, "SFMono-Regular", monospace;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/timeline-main.ts"></script>
  </body>
</html>
