<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code City</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b1020;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      #app canvas {
        display: block;
      }

      .cc-mock-badge {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 10;
        padding: 6px 12px;
        background: #b3401a;
        color: #fff5e8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }

      .cc-fatal-error {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: #1a0a0a;
        color: #ffb4b4;
        font-family: ui-monospace, monospace;
        font-size: 14px;
        white-space: pre-wrap;
        text-align: center;
      }

      .cc-overlay {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        max-width: 340px;
        display: none;
        flex-direction: column;
        gap: 4px;
        background: rgba(12, 16, 32, 0.92);
        border: 1px solid rgba(140, 170, 255, 0.35);
        border-radius: 8px;
        padding: 14px 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        color: #e8ecff;
      }

      .cc-overlay-close {
        position: absolute;
        top: 6px;
        right: 8px;
        background: transparent;
        border: none;
        color: #9fb0e0;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        padding: 4px;
      }

      .cc-overlay-close:hover {
        color: #ffffff;
      }

      .cc-overlay-body {
        margin: 0;
        padding-right: 18px;
        font-family: ui-monospace, "SFMono-Regular", monospace;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .cc-lens-control {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }

      .cc-lens-buttons {
        display: flex;
        gap: 4px;
        background: rgba(12, 16, 32, 0.78);
        border: 1px solid rgba(140, 170, 255, 0.3);
        border-radius: 6px;
        padding: 4px;
      }

      .cc-lens-button {
        background: transparent;
        border: none;
        border-radius: 4px;
        color: #9fb0e0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
      }

      .cc-lens-button:hover {
        color: #e8ecff;
      }

      .cc-lens-button--active {
        background: rgba(140, 170, 255, 0.28);
        color: #ffffff;
        font-weight: 600;
      }

      .cc-layer-control {
        position: absolute;
        left: 12px;
        bottom: 44px;
        z-index: 10;
        display: flex;
        gap: 4px;
        background: rgba(12, 16, 32, 0.78);
        border: 1px solid rgba(140, 170, 255, 0.3);
        border-radius: 6px;
        padding: 4px;
      }

      .cc-layer-button {
        background: transparent;
        border: none;
        border-radius: 4px;
        color: #5d6a90;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
      }

      .cc-layer-button:hover {
        color: #e8ecff;
      }

      .cc-layer-button--active {
        background: rgba(140, 170, 255, 0.28);
        color: #ffffff;
        font-weight: 600;
      }

      .cc-source-badge {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 9;
        padding: 5px 10px;
        background: rgba(12, 16, 32, 0.78);
        border: 1px solid rgba(140, 170, 255, 0.3);
        border-radius: 4px;
        color: #9fb0e0;
        font-family: ui-monospace, "SFMono-Regular", monospace;
        font-size: 11px;
        letter-spacing: 0.02em;
        pointer-events: none;
      }

      .cc-lens-legend {
        max-width: 320px;
        padding: 5px 10px;
        background: rgba(12, 16, 32, 0.78);
        border: 1px solid rgba(140, 170, 255, 0.3);
        border-radius: 4px;
        color: #9fb0e0;
        font-family: ui-monospace, "SFMono-Regular", monospace;
        font-size: 11px;
        letter-spacing: 0.02em;
        text-align: right;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
